<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <pattern id="card-grid-6" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="400" height="240" fill="#ffffff"/>
  <rect width="400" height="240" fill="url(#card-grid-6)"/>

  <!-- Construction Axis -->
  <line x1="50" y1="200" x2="350" y2="50" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Isometric Window Frame (Upright/Leaning Plate) -->
  <g transform="translate(10, 0)">
    <!-- Back Extrusion Shadow/Rim -->
    <path d="M 120 188 L 110 58 L 260 28 L 270 158 Z" fill="#ffffff" stroke="#202020" stroke-width="1.2"/>
    <!-- Window Depth Edge -->
    <path d="M 120 188 L 124 190 L 274 160 L 270 158 Z" fill="#f8fafc" stroke="#202020" stroke-width="1.2"/>
    <path d="M 270 158 L 274 160 L 264 30 L 260 28 Z" fill="#f1f5f9" stroke="#202020" stroke-width="1.2"/>

    <!-- Window Top Header Bar -->
    <path d="M 111 72 L 261 42 L 260 28 L 110 58 Z" fill="#f8fafc" stroke="#202020" stroke-width="1"/>
    <!-- 3 Window Traffic Light Dots (Axonometric) -->
    <circle cx="120" cy="62" r="2.5" fill="#ffffff" stroke="#202020" stroke-width="0.8"/>
    <circle cx="128" cy="60.5" r="2.5" fill="#ffffff" stroke="#202020" stroke-width="0.8"/>
    <circle cx="136" cy="59" r="2.5" fill="#ffffff" stroke="#202020" stroke-width="0.8"/>

    <!-- Left Navigation Sidebar Wireframe -->
    <line x1="150" y1="65" x2="159" y2="180" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="122" y="80" width="20" height="4" rx="2" fill="#94a3b8"/>
    <rect x="123" y="90" width="18" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="124" y="100" width="16" height="4" rx="2" fill="#cbd5e1"/>

    <!-- Main Content Area: Document Title & Text Bars -->
    <rect x="165" y="78" width="55" height="6" rx="2" fill="#202020"/>
    <rect x="166" y="92" width="75" height="4" rx="2" fill="#94a3b8"/>
    <rect x="168" y="102" width="85" height="4" rx="2" fill="#cbd5e1"/>

    <!-- RED ACCENT HIGHLIGHT ROW (Exactly like user's reference image!) -->
    <rect x="169" y="114" width="82" height="7" rx="3.5" fill="#fff1f2" stroke="#ef4444" stroke-width="1.2"/>
    <line x1="174" y1="117.5" x2="230" y2="117.5" stroke="#ef4444" stroke-width="1.5"/>

    <!-- Secondary Text Rows -->
    <rect x="171" y="128" width="70" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="172" y="138" width="60" height="4" rx="2" fill="#cbd5e1"/>

    <!-- Card/Button Element at Bottom -->
    <rect x="174" y="152" width="30" height="10" rx="3" fill="#ffffff" stroke="#202020" stroke-width="1"/>
    <circle cx="180" cy="157" r="2" fill="#ef4444"/>
  </g>
</svg>
