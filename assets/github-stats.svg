<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="850" height="200">
  <defs>
    <style>
      .label { font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #555555; }
      .val { font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #000000; }
      .heading { font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #000000; letter-spacing: -0.01em; }
      .sub { font: 400 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #777777; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="0.5" y="0.5" width="849" height="199" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Left Section: Activity Stats -->
  <g transform="translate(30, 28)">
    <text x="0" y="0" class="heading">GitHub Activity &amp; Engineering Metrics</text>
    <text x="0" y="18" class="sub">TRACKED COMMITS · PRS · CODE REVIEWS · AUDITED RUNTIMES</text>

    <g transform="translate(0, 42)">
      <!-- Metric 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" class="label">Total Stars Earned</text>
        <text x="175" y="0" class="val">175</text>
      </g>
      <!-- Metric 2 -->
      <g transform="translate(0, 24)">
        <text x="0" y="0" class="label">Total Commits (2025–2026)</text>
        <text x="175" y="0" class="val">7,180+</text>
      </g>
      <!-- Metric 3 -->
      <g transform="translate(0, 48)">
        <text x="0" y="0" class="label">Pull Requests Merged</text>
        <text x="175" y="0" class="val">381+</text>
      </g>
      <!-- Metric 4 -->
      <g transform="translate(0, 72)">
        <text x="0" y="0" class="label">Issues Resolved</text>
        <text x="175" y="0" class="val">205+</text>
      </g>
    </g>

    <!-- Rank Badge -->
    <g transform="translate(290, 75)">
      <circle cx="0" cy="0" r="36" fill="none" stroke="#e5e5e5" stroke-width="5"/>
      <circle cx="0" cy="0" r="36" fill="none" stroke="#000000" stroke-width="5" stroke-dasharray="190" stroke-dashoffset="35" stroke-linecap="round"/>
      <text x="0" y="7" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#000000">A+</text>
      <text x="0" y="48" text-anchor="middle" class="sub">ENGINEERING RANK</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="425" y1="25" x2="425" y2="175" stroke="#f0f0f0" stroke-width="1"/>

  <!-- Right Section: Language Distribution -->
  <g transform="translate(455, 28)">
    <text x="0" y="0" class="heading">Production Language Distribution</text>
    <text x="0" y="18" class="sub">MONOCHROME TELEMETRY · ZERO-CHROMA TOKEN LADDER</text>

    <!-- Progress Bar (Monochrome Shading) -->
    <g transform="translate(0, 35)">
      <rect x="0" y="0" width="365" height="8" rx="4" fill="#f0f0f0"/>
      <!-- TypeScript (38%) -->
      <rect x="0" y="0" width="140" height="8" rx="4" fill="#000000"/>
      <!-- Python (25%) -->
      <rect x="142" y="0" width="92" height="8" fill="#333333"/>
      <!-- Rust / Go (20%) -->
      <rect x="236" y="0" width="73" height="8" fill="#666666"/>
      <!-- Swift (11%) -->
      <rect x="311" y="0" width="40" height="8" fill="#999999"/>
      <!-- Other (6%) -->
      <rect x="353" y="0" width="12" height="8" rx="4" fill="#cccccc"/>
    </g>

    <!-- Language Legend (2 columns) -->
    <g transform="translate(0, 64)">
      <!-- Col 1 -->
      <g transform="translate(0, 0)">
        <circle cx="5" cy="5" r="4" fill="#000000"/>
        <text x="16" y="9" class="label">TypeScript</text>
        <text x="120" y="9" class="val">38.5%</text>
      </g>
      <g transform="translate(0, 24)">
        <circle cx="5" cy="5" r="4" fill="#333333"/>
        <text x="16" y="9" class="label">Python 3.12+</text>
        <text x="120" y="9" class="val">25.3%</text>
      </g>
      <g transform="translate(0, 48)">
        <circle cx="5" cy="5" r="4" fill="#666666"/>
        <text x="16" y="9" class="label">Rust &amp; Go</text>
        <text x="120" y="9" class="val">20.5%</text>
      </g>

      <!-- Col 2 -->
      <g transform="translate(190, 0)">
        <circle cx="5" cy="5" r="4" fill="#999999"/>
        <text x="16" y="9" class="label">Swift 6</text>
        <text x="110" y="9" class="val">11.1%</text>
      </g>
      <g transform="translate(190, 24)">
        <circle cx="5" cy="5" r="4" fill="#bbbbbb"/>
        <text x="16" y="9" class="label">Three.js / GLSL</text>
        <text x="110" y="9" class="val">3.0%</text>
      </g>
      <g transform="translate(190, 48)">
        <circle cx="5" cy="5" r="4" fill="#dddddd" stroke="#999999" stroke-width="0.5"/>
        <text x="16" y="9" class="label">Other</text>
        <text x="110" y="9" class="val">1.6%</text>
      </g>
    </g>
  </g>
</svg>
