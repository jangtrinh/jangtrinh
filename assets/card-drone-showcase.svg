<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <pattern id="card-grid-5" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="400" height="240" fill="#ffffff"/>
  <rect width="400" height="240" fill="url(#card-grid-5)"/>

  <!-- Test Stand Base Plate -->
  <path d="M 100 175 L 250 100 L 300 125 L 150 200 Z" fill="#ffffff" stroke="#202020" stroke-width="1.2"/>
  <path d="M 100 175 L 100 182 L 150 207 L 150 200 Z" fill="#f8fafc" stroke="#202020" stroke-width="1.2"/>
  <path d="M 150 200 L 150 207 L 300 132 L 300 125 Z" fill="#f1f5f9" stroke="#202020" stroke-width="1.2"/>

  <!-- Center Riser Column -->
  <line x1="200" y1="145" x2="200" y2="105" stroke="#202020" stroke-width="2"/>
  <ellipse cx="200" cy="105" rx="10" ry="5" fill="#f8fafc" stroke="#202020" stroke-width="1.2"/>

  <!-- Drone Center Carbon Fuselage / Core Plate -->
  <path d="M 185 105 L 200 97 L 215 105 L 200 112 Z" fill="#ffffff" stroke="#202020" stroke-width="1.4"/>
  <circle cx="200" cy="105" r="3" fill="#202020"/>

  <!-- 4 Diagonal Motor Arms -->
  <!-- Arm 1: Front-Left -->
  <line x1="185" y1="105" x2="140" y2="128" stroke="#202020" stroke-width="1.5"/>
  <!-- Arm 2: Front-Right -->
  <line x1="200" y1="112" x2="215" y2="145" stroke="#202020" stroke-width="1.5"/>
  <!-- Arm 3: Rear-Right -->
  <line x1="215" y1="105" x2="260" y2="82" stroke="#202020" stroke-width="1.5"/>
  <!-- Arm 4: Rear-Left -->
  <line x1="200" y1="97" x2="185" y2="65" stroke="#202020" stroke-width="1.5"/>

  <!-- Motor Bells -->
  <circle cx="140" cy="128" r="5" fill="#ffffff" stroke="#202020" stroke-width="1.2"/>
  <circle cx="215" cy="145" r="5" fill="#ffffff" stroke="#202020" stroke-width="1.2"/>
  <circle cx="260" cy="82" r="5" fill="#ffffff" stroke="#202020" stroke-width="1.2"/>
  <circle cx="185" cy="65" r="5" fill="#ffffff" stroke="#202020" stroke-width="1.2"/>

  <!-- Red Accent Propeller Sweep Clearances (Highlighted in Red) -->
  <ellipse cx="140" cy="128" rx="28" ry="14" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,2"/>
  <ellipse cx="215" cy="145" rx="28" ry="14" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,2"/>
  <ellipse cx="260" cy="82" rx="28" ry="14" fill="none" stroke="#202020" stroke-width="0.8" stroke-dasharray="3,2"/>
  <ellipse cx="185" cy="65" rx="28" ry="14" fill="none" stroke="#202020" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- Propeller Blades (2-Blade on Front Motors) -->
  <line x1="120" y1="124" x2="160" y2="132" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="195" y1="141" x2="235" y2="149" stroke="#ef4444" stroke-width="1.5"/>
</svg>
