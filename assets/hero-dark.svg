<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180">
  <defs>
    <pattern id="grid-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#172033" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="glow-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="180" fill="#090d16" rx="12"/>
  <rect width="1000" height="180" fill="url(#grid-dark)" rx="12"/>
  <rect x="0.5" y="0.5" width="999" height="179" fill="none" stroke="#1e293b" stroke-width="1" rx="12"/>

  <!-- Left Accent Terminal Marker -->
  <rect x="40" y="45" width="4" height="90" fill="url(#glow-dark)" rx="2"/>

  <!-- Main Identity Header -->
  <text x="64" y="86" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" letter-spacing="-0.03em">JANG TRINH</text>
  <text x="325" y="86" fill="url(#glow-dark)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="24" letter-spacing="-0.02em">/ design:os</text>

  <!-- Subtitle Hook -->
  <text x="64" y="124" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16">
    Architecting autonomous coding agents, deterministic vector motion, and parametric 3D systems.
  </text>

  <!-- Decorative Isometric Cube Wireframe on Right -->
  <g transform="translate(860, 90)" stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.85">
    <path d="M 0 -44 L 38 -22 L 38 22 L 0 44 L -38 22 L -38 -22 Z" stroke="#38bdf8"/>
    <path d="M 0 0 L 38 -22 M 0 0 L -38 -22 M 0 0 L 0 44" stroke="#818cf8"/>
    <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
    <circle cx="38" cy="-22" r="2.5" fill="#818cf8"/>
    <circle cx="-38" cy="-22" r="2.5" fill="#818cf8"/>
    <circle cx="0" cy="44" r="2.5" fill="#c084fc"/>
    <circle cx="38" cy="22" r="2" fill="#334155"/>
    <circle cx="-38" cy="22" r="2" fill="#334155"/>
  </g>
</svg>
