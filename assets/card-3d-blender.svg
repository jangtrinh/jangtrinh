<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <pattern id="card-grid-4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="400" height="240" fill="#ffffff"/>
  <rect width="400" height="240" fill="url(#card-grid-4)"/>

  <!-- Rotating Coordinate Turntable (C-Axis) -->
  <ellipse cx="200" cy="165" rx="80" ry="40" fill="#ffffff" stroke="#202020" stroke-width="1.2"/>
  <path d="M 120 165 A 80 40 0 0 0 280 165 L 280 173 A 80 40 0 0 1 120 173 Z" fill="#f8fafc" stroke="#202020" stroke-width="1.2"/>

  <!-- Angle Calibration Ticks on Ring -->
  <line x1="140" y1="165" x2="140" y2="173" stroke="#64748b" stroke-width="1"/>
  <line x1="200" y1="205" x2="200" y2="213" stroke="#64748b" stroke-width="1"/>
  <line x1="260" y1="165" x2="260" y2="173" stroke="#64748b" stroke-width="1"/>

  <!-- Parametric 3D Wireframe Mesh (Seated on Table) -->
  <!-- Bottom Base of Mesh -->
  <path d="M 170 155 L 200 140 L 230 155 L 200 170 Z" fill="#ffffff" stroke="#202020" stroke-width="1.2"/>
  <!-- Middle Tier -->
  <path d="M 160 120 L 200 100 L 240 120 L 200 140 Z" fill="#ffffff" stroke="#202020" stroke-width="1.2"/>
  <!-- Top Apex -->
  <path d="M 180 85 L 200 75 L 220 85 L 200 95 Z" fill="#fff1f2" stroke="#ef4444" stroke-width="1.4"/>

  <!-- Vertical Wireframe Edges connecting vertices -->
  <line x1="170" y1="155" x2="160" y2="120" stroke="#202020" stroke-width="1"/>
  <line x1="230" y1="155" x2="240" y2="120" stroke="#202020" stroke-width="1"/>
  <line x1="200" y1="170" x2="200" y2="140" stroke="#202020" stroke-width="1"/>
  <line x1="200" y1="140" x2="200" y2="100" stroke="#202020" stroke-width="1"/>

  <!-- Red Accent Parametric Contour Lines (Selected Normal Ring) -->
  <path d="M 160 120 L 200 100 L 240 120 L 200 140 Z" fill="none" stroke="#ef4444" stroke-width="1.8"/>
  <line x1="160" y1="120" x2="180" y2="85" stroke="#ef4444" stroke-width="1.2"/>
  <line x1="240" y1="120" x2="220" y2="85" stroke="#ef4444" stroke-width="1.2"/>
  <line x1="200" y1="100" x2="200" y2="75" stroke="#ef4444" stroke-width="1.2"/>
  <line x1="200" y1="140" x2="200" y2="95" stroke="#ef4444" stroke-width="1.2"/>

  <!-- Vertex Control Nodes -->
  <circle cx="200" cy="75" r="3" fill="#ffffff" stroke="#ef4444" stroke-width="1.4"/>
  <circle cx="160" cy="120" r="2.5" fill="#202020"/>
  <circle cx="240" cy="120" r="2.5" fill="#202020"/>
  <circle cx="200" cy="140" r="2.5" fill="#202020"/>
</svg>
