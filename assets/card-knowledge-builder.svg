<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <pattern id="card-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="240" fill="#ffffff"/>
  <rect width="400" height="240" fill="url(#card-grid)"/>

  <!-- Construction Axes (faint dashed lines) -->
  <line x1="40" y1="190" x2="360" y2="30" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="40" y1="50" x2="360" y2="210" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Base Slab -->
  <path d="M 120 180 L 260 110 L 320 140 L 180 210 Z" fill="#ffffff" stroke="#202020" stroke-width="1.2"/>
  <path d="M 120 180 L 120 188 L 180 218 L 180 210 Z" fill="#f8fafc" stroke="#202020" stroke-width="1.2"/>
  <path d="M 180 210 L 180 218 L 320 148 L 320 140 Z" fill="#f1f5f9" stroke="#202020" stroke-width="1.2"/>

  <!-- Upright Stand Column -->
  <path d="M 170 145 L 170 65 L 178 61 L 178 141 Z" fill="#ffffff" stroke="#202020" stroke-width="1.2"/>
  <ellipse cx="174" cy="63" rx="4" ry="2" fill="#f1f5f9" stroke="#202020" stroke-width="1.2"/>

  <!-- Horizontal Cross-Arm Bracket -->
  <path d="M 164 100 L 220 72 L 228 76 L 172 104 Z" fill="#ffffff" stroke="#202020" stroke-width="1.2"/>
  <rect x="158" y="96" width="10" height="12" fill="#ffffff" stroke="#202020" stroke-width="1"/>
  <!-- Tightening Knob -->
  <circle cx="152" cy="102" r="4" fill="#ffffff" stroke="#202020" stroke-width="1"/>

  <!-- Dial Indicator Housing -->
  <circle cx="232" cy="74" r="22" fill="#ffffff" stroke="#202020" stroke-width="1.4"/>
  <circle cx="232" cy="74" r="18" fill="#ffffff" stroke="#202020" stroke-width="0.8"/>
  <!-- Dial Stem & Contact Tip -->
  <line x1="232" y1="96" x2="232" y2="152" stroke="#202020" stroke-width="1.2"/>
  <circle cx="232" cy="153" r="2" fill="#ef4444" stroke="#ef4444" stroke-width="0.8"/>
  <!-- Dial Pointer (Red Accent Trace) -->
  <line x1="232" y1="74" x2="242" y2="65" stroke="#ef4444" stroke-width="1.4"/>
  <circle cx="232" cy="74" r="2" fill="#202020"/>

  <!-- Gauge Blocks Stack (Calibration Standards) -->
  <g transform="translate(40, -10)">
    <!-- Block 1 -->
    <path d="M 230 160 L 255 147 L 270 154 L 245 167 Z" fill="#ffffff" stroke="#202020" stroke-width="1"/>
    <path d="M 230 160 L 230 166 L 245 173 L 245 167 Z" fill="#f8fafc" stroke="#202020" stroke-width="1"/>
    <path d="M 245 167 L 245 173 L 270 160 L 270 154 Z" fill="#f1f5f9" stroke="#202020" stroke-width="1"/>
    <!-- Block 2 -->
    <path d="M 232 153 L 253 142 L 268 149 L 247 160 Z" fill="#ffffff" stroke="#202020" stroke-width="1"/>
    <path d="M 232 153 L 232 158 L 247 165 L 247 160 Z" fill="#f8fafc" stroke="#202020" stroke-width="1"/>
    <!-- Block 3 (Red highlighted calibration reference) -->
    <path d="M 234 146 L 251 137 L 266 144 L 249 153 Z" fill="#fff1f2" stroke="#ef4444" stroke-width="1.2"/>
  </g>
</svg>
