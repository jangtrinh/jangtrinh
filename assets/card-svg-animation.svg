<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <pattern id="card-grid-3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="400" height="240" fill="#ffffff"/>
  <rect width="400" height="240" fill="url(#card-grid-3)"/>

  <!-- Base Drawing Platen -->
  <path d="M 80 170 L 260 80 L 330 115 L 150 205 Z" fill="#ffffff" stroke="#202020" stroke-width="1.2"/>
  <path d="M 80 170 L 80 178 L 150 213 L 150 205 Z" fill="#f8fafc" stroke="#202020" stroke-width="1.2"/>
  <path d="M 150 205 L 150 213 L 330 123 L 330 115 Z" fill="#f1f5f9" stroke="#202020" stroke-width="1.2"/>

  <!-- Linear Guide Rails -->
  <line x1="95" y1="162" x2="275" y2="72" stroke="#64748b" stroke-width="1.5"/>
  <line x1="135" y1="197" x2="315" y2="107" stroke="#64748b" stroke-width="1.5"/>

  <!-- Transverse Gantry Beam -->
  <path d="M 160 130 L 220 160 L 225 157 L 165 127 Z" fill="#ffffff" stroke="#202020" stroke-width="1.2"/>

  <!-- Plotter Carriage / Toolhead -->
  <rect x="186" y="137" width="16" height="20" rx="3" fill="#ffffff" stroke="#202020" stroke-width="1.2"/>
  <circle cx="194" cy="147" r="3" fill="#ef4444"/>

  <!-- Pen Stylus Needle -->
  <line x1="194" y1="157" x2="194" y2="175" stroke="#202020" stroke-width="1.2"/>
  <circle cx="194" cy="175" r="1.5" fill="#ef4444"/>

  <!-- The Animated Vector Motion Path (Red Bezier Curve) -->
  <path d="M 130 165 C 160 140, 170 190, 194 175 S 250 120, 270 110" fill="none" stroke="#ef4444" stroke-width="2"/>

  <!-- Velocity Vector Tangent Handle -->
  <line x1="194" y1="175" x2="215" y2="160" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="215" cy="160" r="2.5" fill="#ffffff" stroke="#ef4444" stroke-width="1"/>

  <!-- Vector Keyframe Control Points -->
  <circle cx="130" cy="165" r="3" fill="#ffffff" stroke="#202020" stroke-width="1.2"/>
  <circle cx="270" cy="110" r="3" fill="#ffffff" stroke="#202020" stroke-width="1.2"/>
</svg>
